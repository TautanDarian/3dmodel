<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Model Viewer</title>

  <!-- Basic styling -->
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100vh;
    }

    @media (max-width: 1024px) {
      model-viewer {
        height: 70vh;
      }
    }

    @media (max-width: 767px) {
      model-viewer {
        height: 60vh;
      }
    }
  </style>

  <!-- Load the model-viewer component -->
  <script type="module" src="https://unpkg.com/@google/model-viewer@latest/dist/model-viewer.min.js"></script>
</head>

<body>
  <model-viewer
    src="abstract2.glb"
    alt="3D model"
    shadow-intensity="1"
    camera-controls
    auto-rotate
    disable-zoom
    ar
    ar-modes="webxr scene-viewer quick-look"
    environment-image="neutral"
    poster=""
    exposure="1">
  </model-viewer>
</body>
</html>
